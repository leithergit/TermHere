name: TermHere
options:
  bundleIdPrefix: com.xionggaoli
  deploymentTarget:
    macOS: "13.0"
packages:
  TermHereCore:
    path: Packages/TermHereCore
settings:
  base:
    DEVELOPMENT_TEAM: Z8NL57N2AP
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.9"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO   # drop get-task-allow, required for notarization
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  TermHere:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
    dependencies:
      - package: TermHereCore
      - target: FinderExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xionggaoli.termhere
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TermHere.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Compile TermHere.applescript
        script: |
          set -e
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          osacompile -o "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/TermHere.scpt" "${SRCROOT}/App/Resources/TermHere.applescript"
        inputFiles:
          - $(SRCROOT)/App/Resources/TermHere.applescript
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermHere.scpt
  FinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: TermHereCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xionggaoli.termhere.FinderExtension
        INFOPLIST_FILE: FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderExtension/FinderExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
